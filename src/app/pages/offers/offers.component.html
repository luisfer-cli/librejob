<div class="page-header">
  <h1>{{ "offers.title" | t }}</h1>
  <button class="btn btn-primary" (click)="openNew()">
    <span class="nf nf-plus"></span> {{ "offers.new" | t }}
  </button>
</div>

<!-- Lista -->
<div *ngIf="!showNew && offers.length" class="card list-card">
  <div class="offer-row" *ngFor="let o of offers" (click)="openOffer(o.id)">
    <div class="offer-row-main">
      <span class="offer-row-title">{{ o.title || ("offers.noTitle" | t) }}</span>
      <span class="offer-row-sub">
        <ng-container *ngIf="o.company">{{ o.company }}</ng-container>
        <ng-container *ngIf="o.location"> · {{ o.location }}</ng-container>
        <ng-container *ngIf="o.salary"> · {{ o.salary }}</ng-container>
      </span>
    </div>
    <div class="offer-row-right">
      <span class="badge" [class]="'badge-' + o.status">{{ "status." + o.status | t }}</span>
      <button
        class="btn btn-sm btn-ghost btn-icon"
        (click)="remove(o.id); $event.stopPropagation()"
        [title]="'common.delete' | t"
      >
        <span class="nf nf-delete"></span>
      </button>
    </div>
  </div>
</div>

<p *ngIf="!showNew && !offers.length" class="empty">
  <span class="nf nf-briefcase"></span>
  {{ "offers.empty" | t }}
</p>

<!-- Nueva oferta -->
<div *ngIf="showNew" class="card">
  <div class="new-head">
    <h2>{{ "offers.new" | t }}</h2>
    <button class="btn btn-ghost btn-icon" (click)="cancel()" [title]="'common.cancel' | t">
      <span class="nf nf-close"></span>
    </button>
  </div>
  <p class="muted new-desc">{{ "offers.pasteDesc" | t }}</p>

  <div *ngIf="error" class="alert alert-error">{{ error }}</div>

  <textarea
    #pasteInput
    [(ngModel)]="rawText"
    class="paste-input"
    rows="12"
    [placeholder]="'offers.pastePlaceholder' | t"
  ></textarea>

  <div class="actions">
    <button class="btn btn-primary" (click)="process()" [disabled]="loading">
      <span *ngIf="loading" class="spinner"></span>
      <span *ngIf="!loading" class="nf nf-flask"></span>
      {{ loading ? ("common.processing" | t) : ("offers.process" | t) }}
    </button>
    <button class="btn" (click)="cancel()">{{ "common.cancel" | t }}</button>
  </div>

  <!-- Resultado tras procesar -->
  <div *ngIf="parsed" class="result">
    <div class="result-head">
      <span class="nf nf-check-circle"></span>
      <h3>{{ "offers.extracted" | t }}</h3>
    </div>
    <div class="grid grid-2">
      <div class="field">
        <label>{{ "offers.field.title" | t }}</label>
        <input [(ngModel)]="form.title" />
      </div>
      <div class="field">
        <label>{{ "offers.field.company" | t }}</label>
        <input [(ngModel)]="form.company" />
      </div>
      <div class="field">
        <label>{{ "offers.field.location" | t }}</label>
        <input [(ngModel)]="form.location" />
      </div>
      <div class="field">
        <label>{{ "offers.field.salary" | t }}</label>
        <input [(ngModel)]="form.salary" />
      </div>
      <div class="field">
        <label>{{ "offers.field.jobType" | t }}</label>
        <input [(ngModel)]="form.jobType" />
      </div>
      <div class="field">
        <label>{{ "offers.field.seniority" | t }}</label>
        <input [(ngModel)]="form.seniority" />
      </div>
      <div class="field" style="grid-column: 1 / -1">
        <label>{{ "offers.field.url" | t }}</label>
        <input [(ngModel)]="form.applicationUrl" />
      </div>
    </div>

    <div class="grid grid-2">
      <div class="field">
        <label>{{ "offers.field.requirements" | t }}</label>
        <textarea [(ngModel)]="requirementsText" rows="4"></textarea>
      </div>
      <div class="field">
        <label>{{ "offers.field.responsibilities" | t }}</label>
        <textarea [(ngModel)]="responsibilitiesText" rows="4"></textarea>
      </div>
    </div>

    <label class="ats-toggle">
      <span class="ats-toggle-icon nf nf-chart"></span>
      <span class="ats-toggle-text">
        <strong>{{ "offers.generateAts" | t }}</strong>
        <span class="muted">{{ "offers.generateAtsDesc" | t }}</span>
      </span>
      <input type="checkbox" [(ngModel)]="generateAts" [disabled]="saving" />
    </label>

    <button class="btn btn-primary" (click)="save()" [disabled]="saving">
      <span *ngIf="saving" class="spinner"></span>
      <span *ngIf="!saving" class="nf nf-save"></span>
      {{ "offers.save" | t }}
    </button>
  </div>
</div>
