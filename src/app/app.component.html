<aside
  class="sidebar"
  [class.collapsed]="settings.sidebarMode() === 'collapsed'"
  [class.hidden]="settings.sidebarMode() === 'hidden'"
>
  <div class="sidebar-header">
    <div class="brand">
      <img class="brand-mark" src="/assets/logo.png" alt="LibreJob" />
      <span class="brand-name">LibreJob</span>
    </div>
    <button
      class="collapse-btn"
      (click)="settings.toggleSidebarCollapse()"
      [title]="
        settings.sidebarMode() === 'collapsed'
          ? ('nav.expand' | t)
          : ('nav.collapse' | t)
      "
    >
      <span
        class="nf"
        [class.nf-chevron-left]="settings.sidebarMode() !== 'collapsed'"
        [class.nf-chevron-right]="settings.sidebarMode() === 'collapsed'"
      ></span>
    </button>
  </div>

  <nav>
    <div class="nav-section">
      <span class="nav-label">{{ "nav.principal" | t }}</span>
      <a
        [routerLink]="lastRoutes.dashboard"
        routerLinkActive="active"
        [title]="'nav.dashboard' | t"
      >
        <span class="icon nf nf-dashboard"></span>
        <span class="nav-text">{{ "nav.dashboard" | t }}</span>
      </a>
    </div>

    <div class="nav-section">
      <span class="nav-label">{{ "nav.manage" | t }}</span>
      <a [routerLink]="lastRoutes.cv" routerLinkActive="active" [title]="'nav.cv' | t">
        <span class="icon nf nf-account"></span>
        <span class="nav-text">{{ "nav.cv" | t }}</span>
      </a>
      <a
        [routerLink]="lastRoutes.offers"
        routerLinkActive="active"
        [title]="'nav.offers' | t"
      >
        <span class="icon nf nf-briefcase"></span>
        <span class="nav-text">{{ "nav.offers" | t }}</span>
      </a>
      <a
        [routerLink]="lastRoutes.tests"
        routerLinkActive="active"
        [title]="'nav.tests' | t"
      >
        <span class="icon nf nf-flask"></span>
        <span class="nav-text">{{ "nav.tests" | t }}</span>
      </a>
    </div>

    <div class="nav-section">
      <span class="nav-label">{{ "nav.system" | t }}</span>
      <a
        [routerLink]="lastRoutes.settings"
        routerLinkActive="active"
        [title]="'nav.settings' | t"
      >
        <span class="icon nf nf-cog"></span>
        <span class="nav-text">{{ "nav.settings" | t }}</span>
      </a>
    </div>
  </nav>

  <div class="sidebar-footer">
    <button
      class="theme-toggle"
      (click)="settings.toggleTheme()"
      [title]="'theme.toggle' | t"
    >
      <span
        class="nf"
        [class.nf-sun]="settings.settings().theme === 'dark'"
        [class.nf-moon]="settings.settings().theme !== 'dark'"
      ></span>
      <span class="theme-text">
        {{
          settings.settings().theme === "dark"
            ? ("theme.light" | t)
            : ("theme.dark" | t)
        }}
      </span>
    </button>
  </div>
</aside>

<button
  *ngIf="settings.sidebarMode() === 'hidden'"
  class="floating-menu"
  (click)="settings.toggleSidebarHidden()"
  [title]="'nav.showMenu' | t"
>
  <span class="nf nf-menu"></span>
</button>

<main class="content">
  <div class="inner">
    <router-outlet />
  </div>
</main>

<app-confirm-dialog />

<div class="ai-activity" *ngIf="aiActivity.active()">
  <span class="spinner"></span>
  <span>{{ "ai.running" | t }}</span>
</div>

<div
  class="welcome-backdrop"
  *ngIf="showWelcomeTour && welcomeSteps[welcomeStep] as step"
>
  <section
    class="welcome-card"
    role="dialog"
    aria-modal="true"
    aria-labelledby="welcome-title"
  >
    <div class="welcome-icon">
      <span class="nf" [ngClass]="step.icon"></span>
    </div>

    <p class="welcome-eyebrow">{{ "welcome.eyebrow" | t }}</p>
    <h2 id="welcome-title">{{ step.title | t }}</h2>
    <p class="welcome-text">{{ step.text | t }}</p>

    <div class="welcome-actions">
      <button class="btn" *ngIf="welcomeStep > 0" (click)="prevWelcomeStep()">
        {{ "common.back" | t }}
      </button>
      <button
        class="btn btn-ghost"
        *ngIf="!isWelcomeLastStep"
        (click)="skipWelcomeTour()"
      >
        {{ "welcome.skip" | t }}
      </button>
      <button
        class="btn btn-primary"
        *ngIf="!isWelcomeLastStep"
        (click)="nextWelcomeStep()"
      >
        {{ "common.next" | t }}
      </button>
      <button
        class="btn"
        *ngIf="isWelcomeLastStep"
        (click)="finishWelcomeTour(false)"
      >
        {{ "welcome.noApiKey" | t }}
      </button>
      <button
        class="btn btn-primary"
        *ngIf="isWelcomeLastStep"
        (click)="finishWelcomeTour(true)"
      >
        <span class="nf nf-key"></span>
        {{ "welcome.addApiKey" | t }}
      </button>
    </div>
  </section>
</div>
