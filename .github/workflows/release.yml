name: Release

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      tagName:
        description: >-
          Tag del release a construir (ej. v0.2.0). Vacío = no construir.
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Release Please
        uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: release-please

    if: >-
      always() &&
      !cancelled() &&
      (
        (
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.tagName != ''
        )
        ||
        (
          needs.release-please.result == 'success' &&
          needs.release-please.outputs.release_created == 'true'
        )
      )

    strategy:
      fail-fast: false

      matrix:
        include:
          - platform: ubuntu-22.04
            os: linux

          - platform: windows-latest
            os: windows

    runs-on: ${{ matrix.platform }}

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tagName || github.ref }}

      # ============================================================
      # BUN
      # ============================================================

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ============================================================
      # RUST
      # ============================================================

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # ============================================================
      # LINUX DEPENDENCIES
      # ============================================================

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            squashfs-tools

      # ============================================================
      # FRONTEND
      # ============================================================

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # ============================================================
      # LINUX BUILD
      # ============================================================

      - name: Build Linux AppImage
        if: matrix.os == 'linux'

        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: >-
            ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

        run: |
          set -euo pipefail

          bun run tauri build --bundles appimage

      # ============================================================
      # FIX LINUX APPIMAGE
      #
      # Tauri/linuxdeploy puede empaquetar libwayland-* dentro
      # del AppImage.
      #
      # En sistemas modernos con Mesa + Wayland esto puede producir:
      #
      # Could not create surfaceless EGL display: EGL_BAD_ALLOC
      #
      # Se eliminan las librerías Wayland empaquetadas para que
      # el sistema use las librerías Wayland nativas.
      # ============================================================

      - name: Fix Linux AppImage Wayland libraries
        if: matrix.os == 'linux'

        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: >-
            ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

        shell: bash

        run: |
          set -euo pipefail

          BUNDLE_DIR="src-tauri/target/release/bundle/appimage"

          echo "========================================="
          echo "Looking for AppImage"
          echo "========================================="

          ls -lah "$BUNDLE_DIR"

          APPIMAGE="$(find "$BUNDLE_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*.AppImage' \
            | head -n 1)"

          if [ -z "$APPIMAGE" ]; then
            echo "::error::No AppImage found."
            exit 1
          fi

          echo ""
          echo "AppImage:"
          echo "$APPIMAGE"

          # --------------------------------------------------------
          # Temporary directory
          # --------------------------------------------------------

          WORKDIR="$(mktemp -d)"

          echo ""
          echo "Working directory:"
          echo "$WORKDIR"

          # --------------------------------------------------------
          # Extract AppImage
          # --------------------------------------------------------

          echo ""
          echo "Extracting AppImage..."

          (
            cd "$WORKDIR"

            "$GITHUB_WORKSPACE/$APPIMAGE" \
              --appimage-extract
          )

          APPDIR="$WORKDIR/squashfs-root"

          if [ ! -d "$APPDIR" ]; then
            echo "::error::AppImage extraction failed."
            exit 1
          fi

          # --------------------------------------------------------
          # Show bundled Wayland libraries
          # --------------------------------------------------------

          echo ""
          echo "Bundled Wayland libraries BEFORE fix:"

          find "$APPDIR/usr/lib" \
            -maxdepth 1 \
            -type f \
            -name 'libwayland-*' \
            -print || true

          # --------------------------------------------------------
          # Remove problematic libraries
          # --------------------------------------------------------

          echo ""
          echo "Removing bundled Wayland libraries..."

          rm -f "$APPDIR/usr/lib/libwayland-client.so.0"
          rm -f "$APPDIR/usr/lib/libwayland-cursor.so.0"
          rm -f "$APPDIR/usr/lib/libwayland-egl.so.1"
          rm -f "$APPDIR/usr/lib/libwayland-server.so.0"

          # --------------------------------------------------------
          # Verify
          # --------------------------------------------------------

          echo ""
          echo "Bundled Wayland libraries AFTER fix:"

          find "$APPDIR/usr/lib" \
            -maxdepth 1 \
            -type f \
            -name 'libwayland-*' \
            -print || true

          # --------------------------------------------------------
          # Download appimagetool
          # --------------------------------------------------------

          echo ""
          echo "Downloading appimagetool..."

          APPIMAGETOOL="$WORKDIR/appimagetool"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --output "$APPIMAGETOOL" \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"

          chmod +x "$APPIMAGETOOL"

          # --------------------------------------------------------
          # Remove original AppImage
          # --------------------------------------------------------

          echo ""
          echo "Removing original AppImage..."

          rm -f "$APPIMAGE"

          # --------------------------------------------------------
          # Rebuild AppImage
          # --------------------------------------------------------

          echo ""
          echo "Rebuilding fixed AppImage..."

          ARCH=x86_64 \
            "$APPIMAGETOOL" \
            "$APPDIR" \
            "$APPIMAGE"

          chmod +x "$APPIMAGE"

          echo ""
          echo "Re-signing fixed AppImage..."

          rm -f "$APPIMAGE.sig"
          bun run tauri signer sign "$APPIMAGE"

          # --------------------------------------------------------
          # Verify final file
          # --------------------------------------------------------

          echo ""
          echo "========================================="
          echo "FINAL APPIMAGE"
          echo "========================================="

          ls -lh "$APPIMAGE" "$APPIMAGE.sig"

          file "$APPIMAGE"

          echo ""
          echo "AppImage successfully rebuilt and signed."

      # ============================================================
      # WINDOWS BUILD
      # ============================================================

      - name: Build Windows
        if: matrix.os == 'windows'

        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: >-
            ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

        shell: bash

        run: |
          bun run tauri build

      # ============================================================
      # UPLOAD LINUX ARTIFACT
      # ============================================================

      - name: Upload Linux AppImage
        if: matrix.os == 'linux'

        uses: actions/upload-artifact@v4

        with:
          name: LibreJob-Linux-AppImage
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig

          if-no-files-found: error

      # ============================================================
      # UPLOAD WINDOWS ARTIFACT
      # ============================================================

      - name: Upload Windows bundles
        if: matrix.os == 'windows'

        uses: actions/upload-artifact@v4

        with:
          name: LibreJob-Windows
          path: src-tauri/target/release/bundle/**

          if-no-files-found: error

      # ============================================================
      # UPLOAD WINDOWS BUNDLES TO GITHUB RELEASE
      # ============================================================

      - name: Upload Windows bundles to Release
        if: matrix.os == 'windows'

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tagName }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}

        shell: bash

        run: |
          set -euo pipefail
          TAG_NAME="${INPUT_TAG:-$RELEASE_TAG}"

          echo "Looking for Windows bundles..."

          FILES=()
          BUNDLE_NSIS="src-tauri/target/release/bundle/nsis"
          BUNDLE_MSI="src-tauri/target/release/bundle/msi"

          for dir in "$BUNDLE_NSIS" "$BUNDLE_MSI"; do
            if [ -d "$dir" ]; then
              while IFS= read -r file; do
                FILES+=("$file")
              done < <(
                find "$dir" \
                  -maxdepth 1 \
                  -type f \
                  \( -name '*.exe' -o -name '*.msi' -o -name '*.sig' \)
              )
            fi
          done

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::No Windows bundles found."
            exit 1
          fi

          echo ""
          echo "Release tag:"
          echo "$TAG_NAME"

          echo ""
          echo "Files to upload:"
          printf '%s\n' "${FILES[@]}"

          gh release upload \
            "$TAG_NAME" \
            "${FILES[@]}" \
            --clobber

      # ============================================================
      # UPLOAD LINUX APPIMAGE TO GITHUB RELEASE
      # ============================================================

      - name: Upload Linux AppImage to Release
        if: matrix.os == 'linux'

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tagName }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}

        shell: bash

        run: |
          set -euo pipefail
          TAG_NAME="${INPUT_TAG:-$RELEASE_TAG}"

          APPIMAGE="$(find \
            src-tauri/target/release/bundle/appimage \
            -maxdepth 1 \
            -type f \
            -name '*.AppImage' \
            | head -n 1)"

          if [ -z "$APPIMAGE" ]; then
            echo "::error::No AppImage found."
            exit 1
          fi

          echo "Uploading:"
          echo "$APPIMAGE"

          echo "Release tag:"
          echo "$TAG_NAME"

          gh release upload \
            "$TAG_NAME" \
            "$APPIMAGE" \
            "$APPIMAGE.sig" \
            --clobber

  latest-json:
    needs:
      - release-please
      - build

    if: >-
      always() &&
      needs.build.result == 'success' &&
      (
        (
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.tagName != ''
        )
        ||
        (
          needs.release-please.result == 'success' &&
          needs.release-please.outputs.release_created == 'true'
        )
      )

    runs-on: ubuntu-latest

    steps:
      - name: Generate and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tagName }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          TAG_NAME="${INPUT_TAG:-$RELEASE_TAG}"

          VERSION="${TAG_NAME#v}"
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}"
          SIG_DIR="$(mktemp -d)"

          gh release download "$TAG_NAME" --pattern '*.sig' --dir "$SIG_DIR"

          ASSETS_JSON="$(gh release view "$TAG_NAME" --json assets)"
          LINUX_APPIMAGE="$(
            jq -r '.assets[].name | select(endswith(".AppImage"))' \
              <<<"$ASSETS_JSON" \
              | head -n 1
          )"
          WINDOWS_EXE="$(
            jq -r '.assets[].name | select(endswith("-setup.exe"))' \
              <<<"$ASSETS_JSON" \
              | head -n 1
          )"

          if [ -z "$LINUX_APPIMAGE" ] || [ -z "$WINDOWS_EXE" ]; then
            echo "::error::Missing updater assets."
            echo "Linux='$LINUX_APPIMAGE' Windows='$WINDOWS_EXE'"
            exit 1
          fi

          LINUX_SIG_FILE="$SIG_DIR/$LINUX_APPIMAGE.sig"
          WINDOWS_SIG_FILE="$SIG_DIR/$WINDOWS_EXE.sig"

          if [ ! -f "$LINUX_SIG_FILE" ] || [ ! -f "$WINDOWS_SIG_FILE" ]; then
            echo "::error::Missing updater signatures."
            ls -lah "$SIG_DIR"
            exit 1
          fi

          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg linux_url "$BASE_URL/$LINUX_APPIMAGE" \
            --arg linux_sig "$(cat "$LINUX_SIG_FILE")" \
            --arg windows_url "$BASE_URL/$WINDOWS_EXE" \
            --arg windows_sig "$(cat "$WINDOWS_SIG_FILE")" \
            '{
              version: $version,
              notes: "",
              pub_date: $pub_date,
              platforms: {
                "linux-x86_64": {
                  url: $linux_url,
                  signature: $linux_sig
                },
                "windows-x86_64": {
                  url: $windows_url,
                  signature: $windows_sig
                }
              }
            }' > latest.json

          cat latest.json

          gh release upload "$TAG_NAME" latest.json --clobber
